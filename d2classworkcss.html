<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Model with Three Borders</title>
<style>
.outer-box {
  border: 10px solid #4a90e2;
  padding: 20px;
  width: 300px;
  background-color: #f0f8ff;
}
.middle-box {
  border: 6px solid #50c878;
  padding: 15px;
  background-color: #ffffff;
}
.inner-box {
  border: 3px solid #ff6f61;
  padding: 10px;
  background-color: #fafafa;
  text-align: center;
}
</style>
</head>
<body>
<div class="outer-box">
  <div class="middle-box">
    <div class="inner-box">
      Layered Box Model
    </div>
  </div>
</div>
</body>
</html>
