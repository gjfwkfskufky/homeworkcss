<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivandrum Cafe</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
   
    h3 {
      text-align: right;
      font-family: "Trebuchet MS", sans-serif;
      font-size: 28px;
      color: #d63384;
      margin-top: 10px;
      margin-right: 30px;
    }

   
    .welcome {
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 3px;
      word-spacing: 10px;
      margin: 20px 0;
      font-weight: bold;
      color: #444;
    }

    table {
      width: 60%;
      margin: 0 auto;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #333;
      padding: 10px;
      text-align: center;
      vertical-align: middle;
    }

    th {
      background-color: #f8d7da;
      color: #333;
    }

    
    a {
      text-decoration: none;
      color: #dc3545;
      font-weight: bold;
    }

    a:hover {
  color: hotpink;
}

  
    .icon {
      font-size: 30px;
      color: #d63384;
      vertical-align: middle;
      margin: 0 5px;
    }

    
    .footer-links {
      text-align: center;
      margin-top: 30px;
    }
  </style>


</head>

<body>

  <h3>
    Trivandrum Cafe 
    <i class="bi bi-cup-hot-fill"></i>
  </h3>

  <p class="welcome">Welcome to our restaurant</p>

  
  <table>
    <tr>
      <th>Menu Item</th>
      <th>Price (₹)</th>
    </tr>
    <tr>
      <td>Shawai</td>
      <td>150</td>
    </tr>
    <tr>
      <td>Peri Peri Alfaham</td>
      <td>120</td>
    </tr>
    <tr>
      <td>Chicken Mandi</td>
      <td>200</td>
    </tr>
  </table>

  <div class="footer-links">
    <p>
      <a href="#">View Full Menu</a> | 
      <a href="#">Contact Us</a> 
      
  </div>

</body>
</html>
